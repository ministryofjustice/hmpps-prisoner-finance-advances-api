hmpps-auth:
  url: "http://localhost:8090/auth"

general-ledger-api:
  url: http://localhost:8084
  client:
    id: hmpps-prisoner-finance-general-ledger-api
    secret: clientsecret

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true


spring:
  application:
    name: hmpps-prisoner-finance-advances-api

  datasource:
    url: 'jdbc:postgresql://${DB_SERVER:localhost:5437}/${DB_NAME:advances}?sslmode=prefer'
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}

advances-api:
  client:
    id: ${ADVANCES_API_CLIENT_ID:hmpps-prisoner-finance-advances-api-1}
    secret: ${ADVANCES_API_CLIENT_SECRET:clientsecret}

hmpps:
  sqs:
    localstackUrl: ${HMPPS_SQS_LOCALSTACK_URL:http://localhost:4566}
    provider: localstack
    queues:
      domainevents:
        queueName: prisoner-finance-event-queue
        dlqName: prisoner-finance-event-dlq
        subscribeTopicId: domainevents
        subscribeFilter: '{"eventType":[ "prison-offender-events.prisoner.merged"] }'
    topics:
      domainevents:
        arn: arn:aws:sns:eu-west-2:000000000000:11111111-2222-3333-4444-555555555555